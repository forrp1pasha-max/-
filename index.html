<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПДБ — Система задач</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 bg-zinc-900 p-6 overflow-auto">
      <h1 class="text-3xl font-bold mb-8">ПДБ</h1>
      
      <div class="mb-6">
        <p class="text-zinc-400">Текущий пользователь</p>
        <p id="current-user" class="text-xl font-semibold"></p>
        <p id="current-role" class="text-emerald-400"></p>
      </div>

      <button onclick="logout()" class="text-red-400 mb-8">Выйти</button>

      <h2 class="uppercase text-xs text-zinc-500 mb-3">Текущая занятость</h2>
      <div id="workload-list" class="space-y-3"></div>

      <button onclick="showActivityModal()" class="mt-6 w-full bg-violet-600 py-3 rounded-xl">Отметить чем занят</button>
    </div>

    <!-- Main -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-zinc-800 bg-zinc-900 px-8 flex items-center">
        <button onclick="showAddTaskModal()" class="bg-emerald-500 px-6 py-2 rounded-xl">+ Новая задача</button>
      </div>
      <div class="p-8" id="tasks-container">
        <p class="text-zinc-500">Загрузка...</p>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
    <div class="bg-zinc-900 p-8 rounded-3xl w-full max-w-md">
      <h3 class="text-xl mb-4">Новая задача</h3>
      <input id="task-title" placeholder="Название задачи" class="w-full p-4 bg-zinc-800 rounded-2xl mb-4">
      <select id="task-employees" multiple class="w-full p-4 bg-zinc-800 rounded-2xl mb-4 h-52"></select>
      <input id="task-datetime" type="datetime-local" class="w-full p-4 bg-zinc-800 rounded-2xl mb-6">
      <div class="flex gap-3">
        <button onclick="hideModal()" class="flex-1 py-3 border border-zinc-700 rounded-2xl">Отмена</button>
        <button onclick="addTask()" class="flex-1 py-3 bg-blue-600 rounded-2xl">Создать</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBon1uvc3ckBgxd7NXDig9HPhzfRBvWaoI",
      authDomain: "pdb-tasks.firebaseapp.com",
      databaseURL: "https://pdb-tasks-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pdb-tasks",
      storageBucket: "pdb-tasks.firebasestorage.app",
      messagingSenderId: "766735058964",
      appId: "1:766735058964:web:284ea79d86b91eff4ebf01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let tasks = [];

    const users = [
      { name: "Пантелеева Ильзира", role: "Главный специалист", password: "1234" },
      { name: "Фазылов Азат", role: "Ведущий специалист", password: "1234" },
      { name: "Заводнов Илья", role: "Ведущий специалист", password: "1234" },
      { name: "Матюшкин Эдвард", role: "Специалист", password: "1234" },
      { name: "Ильин Ярослав", role: "Специалист", password: "1234" },
      { name: "Варламова Оксана", role: "Специалист", password: "1234" },
      { name: "Карасев Роман", role: "Младший специалист", password: "1234" },
      { name: "Ахметшина Вероника", role: "Младший специалист", password: "1234" },
      { name: "Бурдина Динара", role: "Младший специалист", password: "1234" },
      { name: "Матвеев Шамиль", role: "Младший специалист", password: "1234" },
      { name: "Черных Даниил", role: "Старший специалист", password: "1234" }
    ];

    function login() {
      const name = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const user = users.find(u => u.name === name && u.password === pass);
      if (user) {
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(user));
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('current-user').textContent = user.name;
        document.getElementById('current-role').textContent = user.role;
      }
    }

    function showAddTaskModal() {
      if (!currentUser) return;
      const select = document.getElementById('task-employees');
      select.innerHTML = '';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.name;
        opt.textContent = u.name;
        select.appendChild(opt);
      });
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const selected = Array.from(document.getElementById('task-employees').selectedOptions).map(o => o.value);

      if (!title || selected.length === 0) {
        alert("Введите название и выберите исполнителя");
        return;
      }

      selected.forEach(name => {
        tasks.push({
          id: Date.now().toString(),
          title: title,
          assignees: [name],
          status: 'todo',
          createdBy: currentUser.name
        });
      });

      db.ref('tasks').set(tasks);
      hideModal();
      document.getElementById('task-title').value = '';
    }

    function renderTasks() {
      // Пока упрощённо
      console.log("Задачи обновлены, всего:", tasks.length);
    }

    window.onload = () => {
      // Автологин для теста (можно убрать)
      document.getElementById('username').value = "Фазылов Азат";
      document.getElementById('password').value = "1234";
      login();
    };
  </script>
</body>
</html>
