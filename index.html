<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПДБ — Система задач</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .task-card:hover { transform: translateY(-6px); }
    .tab-btn.active { background-color: rgb(37 99 235); color: white; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 bg-zinc-900 border-r border-zinc-800 p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-violet-600 rounded-2xl flex items-center justify-center text-3xl font-bold">ПДБ</div>
        <h1 class="text-3xl font-bold">ПДБ</h1>
      </div>

      <div class="mb-6 bg-zinc-800 rounded-3xl p-4">
        <p class="text-zinc-400 text-sm">Текущий пользователь</p>
        <p id="current-user" class="font-semibold text-lg"></p>
        <p id="current-role" class="text-sm text-emerald-400"></p>
      </div>

      <button onclick="logout()" class="w-full mb-8 text-red-400 hover:text-red-500 flex items-center gap-2">Выйти</button>

      <h2 class="text-sm uppercase tracking-widest text-zinc-500 mb-3">Текущая занятость</h2>
      <div id="workload-list" class="space-y-3 mb-8"></div>

      <button onclick="showActivityModal()" class="w-full bg-violet-600 hover:bg-violet-500 py-3.5 rounded-2xl flex items-center justify-center gap-2 font-medium">
        <i class="fas fa-clock"></i> Отметить чем занят
      </button>
    </div>

    <!-- Main -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-zinc-800 bg-zinc-900 px-8 flex items-center justify-between">
        <div class="flex gap-4 items-center">
          <button onclick="setView('mine')" id="btn-mine" class="tab-btn active px-6 py-2 rounded-2xl font-medium">Мои задачи</button>
          <button onclick="setView('subordinates')" id="btn-sub" class="tab-btn px-6 py-2 rounded-2xl font-medium">Задачи подчинённых</button>
          <button onclick="setView('archive')" id="btn-archive" class="tab-btn px-6 py-2 rounded-2xl font-medium">Архив</button>
        </div>

        <div class="flex items-center gap-4">
          <input id="search-input" type="text" placeholder="🔍 Поиск задач..." 
                 class="bg-zinc-800 rounded-2xl px-5 py-2.5 w-96 outline-none focus:ring-2 focus:ring-blue-500"
                 onkeyup="renderTasks()">

          <select id="filter-assignee" class="bg-zinc-800 rounded-2xl px-5 py-2.5 outline-none focus:ring-2 focus:ring-blue-500" onchange="renderTasks()">
            <option value="">Все исполнители</option>
          </select>

          <button onclick="showAddTaskModal()" id="add-task-btn" class="hidden bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl flex items-center gap-2 font-medium">
            <i class="fas fa-plus"></i> Новая задача
          </button>
        </div>
      </div>

      <div class="p-8 flex-1 overflow-y-auto" id="tasks-container"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 z-50">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text"></span>
  </div>

  <!-- Модальные окна -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-lg mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Новая задача</h3>
      <input id="task-title" placeholder="Название задачи" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4 outline-none">
      <select id="task-employees" multiple class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 h-56 outline-none"></select>
      <input id="task-datetime" type="datetime-local" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 outline-none">
      <div class="flex gap-4">
        <button onclick="hideModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="addTask()" class="flex-1 py-4 rounded-2xl bg-blue-600">Создать задачу</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно делегирования -->
  <div id="delegate-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Делегировать задачу</h3>
      
      <div class="mb-4">
        <label class="block text-sm text-zinc-400 mb-2">Кому делегировать</label>
        <select id="delegate-to" class="w-full bg-zinc-800 rounded-2xl px-5 py-3 outline-none"></select>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-zinc-400 mb-2">Комментарий (почему делегируешь)</label>
        <textarea id="delegate-comment" rows="3" placeholder="Например: У меня сейчас нет времени, передаю тебе..."
                  class="w-full bg-zinc-800 rounded-2xl px-5 py-3 outline-none resize-y"></textarea>
      </div>

      <div class="flex gap-4">
        <button onclick="hideDelegateModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="confirmDelegate()" class="flex-1 py-4 rounded-2xl bg-blue-600">Делегировать</button>
      </div>
    </div>
  </div>

  <!-- Остальные модальные окна (activity и login) -->
  <div id="activity-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Чем сейчас занят</h3>
      <input id="activity-desc" placeholder="Что делаю..." class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4 outline-none">
      <select id="activity-task" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 outline-none"></select>
      <div class="grid grid-cols-2 gap-4">
        <input id="activity-from" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
        <input id="activity-to" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideActivityModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="saveActivity()" class="flex-1 py-4 rounded-2xl bg-violet-600">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center">Вход в ПДБ</h2>
      <input id="username" placeholder="ФИО" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
      <input id="password" type="password" placeholder="Пароль" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
      <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-medium">Войти</button>
      <p class="text-center text-xs text-zinc-500 mt-4">Пароль: 1234</p>
    </div>
  </div>

  <script>
    // === Весь твой предыдущий код остаётся без изменений до функции renderTasks ===
    // (я оставил только ключевые изменения для краткости, но в реальном файле нужно вставить полный код)

    // ... (весь предыдущий код до renderTasks)

    function renderTasks() {
      // ... твой текущий код renderTasks ...

      // Внутри цикла forEach добавь кнопку делегирования:
      // (примерно после строки с verifiedBy)

      // Пример добавления кнопки делегирования:
      const isAssignee = task.assignees.includes(currentUser.name);
      const canDelegate = isAssignee && currentView !== 'archive';

      // В HTML карточки добавь:
      // ${canDelegate ? `
      //   <button onclick="showDelegateModal('${task.id}')" 
      //           class="mt-4 w-full text-xs bg-zinc-700 hover:bg-zinc-600 py-2 rounded-xl">
      //     Делегировать
      //   </button>
      // ` : ''}
    }

    // === НОВЫЕ ФУНКЦИИ ДЕЛЕГИРОВАНИЯ ===

    let currentDelegatingTaskId = null;

    function showDelegateModal(taskId) {
      currentDelegatingTaskId = taskId;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const select = document.getElementById('delegate-to');
      select.innerHTML = '';

      // Показываем только тех, кому можно делегировать (не себя)
      const possible = getAllowedEmployees().filter(u => u.name !== currentUser.name);
      
      possible.forEach(person => {
        const opt = document.createElement('option');
        opt.value = person.name;
        opt.textContent = `${person.name} (${person.role})`;
        select.appendChild(opt);
      });

      document.getElementById('delegate-comment').value = '';
      document.getElementById('delegate-modal').classList.remove('hidden');
    }

    function hideDelegateModal() {
      document.getElementById('delegate-modal').classList.add('hidden');
      currentDelegatingTaskId = null;
    }

    function confirmDelegate() {
      const task = tasks.find(t => t.id === currentDelegatingTaskId);
      if (!task) return;

      const newAssignee = document.getElementById('delegate-to').value;
      const comment = document.getElementById('delegate-comment').value.trim();

      if (!newAssignee) return alert("Выберите сотрудника");

      // Добавляем нового исполнителя (если ещё нет)
      if (!task.assignees.includes(newAssignee)) {
        task.assignees.push(newAssignee);
      }

      // Сохраняем комментарий о делегировании
      if (!task.comments) task.comments = [];
      task.comments.push({
        text: comment || "Без комментария",
        by: currentUser.name,
        type: "delegation",
        to: newAssignee,
        timestamp: Date.now()
      });

      // Сохраняем в Firebase
      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);

      hideDelegateModal();
      showToast(`Задача делегирована ${newAssignee}`);
      renderTasks();
    }

    // В renderTasks добавь отображение комментариев (если есть):
    // После строки с "Проверил:"
    // ${task.comments && task.comments.length > 0 ? `
    //   <div class="mt-3 text-xs text-zinc-400">
    //     ${task.comments.map(c => `
    //       <div class="mb-1">• ${c.by} → ${c.to || ''}: ${c.text}</div>
    //     `).join('')}
    //   </div>
    // ` : ''}
  </script>
</body>
</html>
