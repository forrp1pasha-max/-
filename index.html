<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПДБ — Система задач</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .task-card { transition: all 0.3s; }
    .task-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="flex h-screen">
    <div class="w-80 bg-zinc-900 border-r border-zinc-800 p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-violet-600 rounded-2xl flex items-center justify-center text-3xl font-bold">ПДБ</div>
        <h1 class="text-3xl font-bold">ПДБ</h1>
      </div>

      <div class="mb-6 bg-zinc-800 rounded-3xl p-4">
        <p class="text-zinc-400 text-sm">Текущий пользователь</p>
        <p id="current-user" class="font-semibold text-lg"></p>
        <p id="current-role" class="text-sm text-emerald-400"></p>
      </div>

      <button onclick="logout()" class="w-full mb-8 text-red-400 hover:text-red-500">Выйти</button>

      <h2 class="text-sm uppercase tracking-widest text-zinc-500 mb-3">Текущая занятость</h2>
      <div id="workload-list" class="space-y-3"></div>

      <button onclick="showActivityModal()" class="w-full mt-6 bg-violet-600 hover:bg-violet-500 py-3 rounded-2xl">Отметить чем занят</button>
    </div>

    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-zinc-800 bg-zinc-900 px-8 flex items-center justify-between">
        <div class="flex gap-4">
          <button onclick="setView('mine')" id="btn-mine" class="tab-btn active px-6 py-2 rounded-2xl">Мои задачи</button>
          <button onclick="setView('subordinates')" id="btn-sub" class="tab-btn hidden px-6 py-2 rounded-2xl">Задачи подчинённых</button>
        </div>
        <button onclick="showAddTaskModal()" id="add-task-btn" class="hidden bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl">+ Новая задача</button>
      </div>
      <div class="p-8 flex-1 overflow-y-auto" id="tasks-container"></div>
    </div>
  </div>

  <!-- Modals -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-lg mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Новая задача</h3>
      <input id="task-title" placeholder="Название задачи" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
      <select id="task-employees" multiple class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 h-56"></select>
      <input id="task-datetime" type="datetime-local" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
      <div class="flex gap-4">
        <button onclick="hideModal()" class="flex-1 py-4 rounded-2xl border">Отмена</button>
        <button onclick="addTask()" class="flex-1 py-4 rounded-2xl bg-blue-600">Создать задачу</button>
      </div>
    </div>
  </div>

  <!-- Activity Modal -->
  <div id="activity-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Чем сейчас занят</h3>
      <input id="activity-desc" placeholder="Описание" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
      <select id="activity-task" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6"></select>
      <div class="grid grid-cols-2 gap-4">
        <input id="activity-from" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
        <input id="activity-to" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideActivityModal()" class="flex-1 py-4 rounded-2xl border">Отмена</button>
        <button onclick="saveActivity()" class="flex-1 py-4 rounded-2xl bg-violet-600">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center">Вход в ПДБ</h2>
      <input id="username" placeholder="ФИО" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
      <input id="password" type="password" placeholder="Пароль" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
      <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl">Войти</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBon1uvc3ckBgxd7NXDig9HPhzfRBvWaoI",
      authDomain: "pdb-tasks.firebaseapp.com",
      databaseURL: "https://pdb-tasks-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pdb-tasks",
      storageBucket: "pdb-tasks.firebasestorage.app",
      messagingSenderId: "766735058964",
      appId: "1:766735058964:web:284ea79d86b91eff4ebf01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let tasks = [];
    let activities = [];

    const users = [ /* ваш список */ 
      { name: "Пантелеева Ильзира", role: "Главный специалист", password: "1234" },
      { name: "Фазылов Азат", role: "Ведущий специалист", password: "1234" },
      { name: "Заводнов Илья", role: "Ведущий специалист", password: "1234" },
      { name: "Матюшкин Эдвард", role: "Специалист", password: "1234" },
      { name: "Ильин Ярослав", role: "Специалист", password: "1234" },
      { name: "Варламова Оксана", role: "Специалист", password: "1234" },
      { name: "Карасев Роман", role: "Младший специалист", password: "1234" },
      { name: "Ахметшина Вероника", role: "Младший специалист", password: "1234" },
      { name: "Бурдина Динара", role: "Младший специалист", password: "1234" },
      { name: "Матвеев Шамиль", role: "Младший специалист", password: "1234" },
      { name: "Черных Даниил", role: "Старший специалист", password: "1234" }
    ];

    db.ref('tasks').on('value', snap => { tasks = snap.val() ? Object.values(snap.val()) : []; renderTasks(); });
    db.ref('activities').on('value', snap => { activities = snap.val() ? Object.values(snap.val()) : []; renderWorkload(); });

    function login() {
      const name = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const user = users.find(u => u.name === name && u.password === pass);
      if (user) {
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(user));
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('current-user').textContent = user.name;
        document.getElementById('current-role').textContent = user.role;
        document.getElementById('add-task-btn').classList.toggle('hidden', user.role === "Младший специалист");
        renderAll();
      } else alert("Неверный логин или пароль");
    }

    function showAddTaskModal() {
      const select = document.getElementById('task-employees');
      select.innerHTML = '';
      users.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.name;
        opt.textContent = `${emp.name} (${emp.role})`;
        select.appendChild(opt);
      });
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const selected = Array.from(document.getElementById('task-employees').selectedOptions).map(opt => opt.value);

      if (!title || selected.length === 0) {
        alert("Введите название и выберите исполнителя(ей)");
        return;
      }

      selected.forEach(name => {
        tasks.push({
          id: 'task_' + Date.now() + Math.random().toString(36),
          title: title,
          assignees: [name],
          status: 'todo',
          createdBy: currentUser.name,
          createdAt: new Date().toISOString()
        });
      });

      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);

      hideModal();
      document.getElementById('task-title').value = '';
      alert('Задача создана!');
    }

    function renderTasks() {
      // ... (оставил упрощённо)
      console.log("Задач загружено:", tasks.length);
      // Здесь можно добавить отображение, если нужно
    }

    function renderAll() { renderTasks(); }

    window.onload = () => {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('current-user').textContent = currentUser.name;
        document.getElementById('current-role').textContent = currentUser.role;
      }
    };
  </script>
</body>
</html>
