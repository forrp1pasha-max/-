<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПДБ — Система задач</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .task-card:hover { transform: translateY(-6px); }
    .tab-btn.active { background-color: rgb(37 99 235); color: white; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 bg-zinc-900 border-r border-zinc-800 p-6 overflow-y-auto">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-violet-600 rounded-2xl flex items-center justify-center text-3xl font-bold">ПДБ</div>
        <h1 class="text-3xl font-bold">ПДБ</h1>
      </div>

      <div class="mb-6 bg-zinc-800 rounded-3xl p-4">
        <p class="text-zinc-400 text-sm">Текущий пользователь</p>
        <p id="current-user" class="font-semibold text-lg"></p>
        <p id="current-role" class="text-sm text-emerald-400"></p>
      </div>

      <button onclick="logout()" class="w-full mb-8 text-red-400 hover:text-red-500 flex items-center gap-2">Выйти</button>

      <h2 class="text-sm uppercase tracking-widest text-zinc-500 mb-3">Текущая занятость</h2>
      <div id="workload-list" class="space-y-3 mb-8"></div>

      <button onclick="showActivityModal()" class="w-full bg-violet-600 hover:bg-violet-500 py-3.5 rounded-2xl flex items-center justify-center gap-2 font-medium">
        <i class="fas fa-clock"></i> Отметить чем занят
      </button>
    </div>

    <!-- Main -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-zinc-800 bg-zinc-900 px-8 flex items-center justify-between">
        <div class="flex gap-4 items-center">
          <button onclick="setView('mine')" id="btn-mine" class="tab-btn active px-6 py-2 rounded-2xl font-medium">Мои задачи</button>
          <button onclick="setView('subordinates')" id="btn-sub" class="tab-btn px-6 py-2 rounded-2xl font-medium">Задачи подчинённых</button>
          <button onclick="setView('archive')" id="btn-archive" class="tab-btn px-6 py-2 rounded-2xl font-medium">Архив</button>
        </div>

        <div class="flex items-center gap-4">
          <input id="search-input" type="text" placeholder="🔍 Поиск задач..." 
                 class="bg-zinc-800 rounded-2xl px-5 py-2.5 w-96 outline-none focus:ring-2 focus:ring-blue-500"
                 onkeyup="renderTasks()">

          <select id="filter-assignee" class="bg-zinc-800 rounded-2xl px-5 py-2.5 outline-none focus:ring-2 focus:ring-blue-500" onchange="renderTasks()">
            <option value="">Все исполнители</option>
          </select>

          <button onclick="showAddTaskModal()" id="add-task-btn" class="hidden bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl flex items-center gap-2 font-medium">
            <i class="fas fa-plus"></i> Новая задача
          </button>
        </div>
      </div>

      <div class="p-8 flex-1 overflow-y-auto" id="tasks-container"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 z-50">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text"></span>
  </div>

  <!-- Модальное окно создания задачи -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-lg mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Новая задача</h3>
      <input id="task-title" placeholder="Название задачи" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4 outline-none">
      <select id="task-employees" multiple class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 h-56 outline-none"></select>
      <input id="task-datetime" type="datetime-local" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 outline-none">
      <div class="flex gap-4">
        <button onclick="hideModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="addTask()" class="flex-1 py-4 rounded-2xl bg-blue-600">Создать задачу</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно делегирования -->
  <div id="delegate-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Делегировать задачу</h3>
      
      <div class="mb-4">
        <label class="block text-sm text-zinc-400 mb-2">Кому делегировать</label>
        <select id="delegate-to" class="w-full bg-zinc-800 rounded-2xl px-5 py-3 outline-none"></select>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-zinc-400 mb-2">Комментарий</label>
        <textarea id="delegate-comment" rows="3" placeholder="Почему делегируешь задачу..."
                  class="w-full bg-zinc-800 rounded-2xl px-5 py-3 outline-none resize-y"></textarea>
      </div>

      <div class="flex gap-4">
        <button onclick="hideDelegateModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="confirmDelegate()" class="flex-1 py-4 rounded-2xl bg-blue-600">Делегировать</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно занятости -->
  <div id="activity-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-8">
      <h3 class="text-2xl font-semibold mb-6">Чем сейчас занят</h3>
      <input id="activity-desc" placeholder="Что делаю..." class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4 outline-none">
      <select id="activity-task" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6 outline-none"></select>
      <div class="grid grid-cols-2 gap-4">
        <input id="activity-from" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
        <input id="activity-to" type="time" class="bg-zinc-800 rounded-2xl px-5 py-4">
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideActivityModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700">Отмена</button>
        <button onclick="saveActivity()" class="flex-1 py-4 rounded-2xl bg-violet-600">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно входа -->
  <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center">Вход в ПДБ</h2>
      <input id="username" placeholder="ФИО" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4">
      <input id="password" type="password" placeholder="Пароль" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-6">
      <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-medium">Войти</button>
      <p class="text-center text-xs text-zinc-500 mt-4">Пароль: 1234</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBon1uvc3ckBgxd7NXDig9HPhzfRBvWaoI",
      authDomain: "pdb-tasks.firebaseapp.com",
      databaseURL: "https://pdb-tasks-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pdb-tasks",
      storageBucket: "pdb-tasks.firebasestorage.app",
      messagingSenderId: "766735058964",
      appId: "1:766735058964:web:284ea79d86b91eff4ebf01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let currentView = 'mine';
    let tasks = [];
    let activities = [];
    let archive = [];

    const users = [
      { name: "Пантелеева Ильзира", role: "Главный специалист", password: "1234" },
      { name: "Фазылов Азат", role: "Ведущий специалист", password: "1234" },
      { name: "Заводнов Илья", role: "Ведущий специалист", password: "1234" },
      { name: "Матюшкин Эдвард", role: "Специалист", password: "1234" },
      { name: "Ильин Ярослав", role: "Специалист", password: "1234" },
      { name: "Варламова Оксана", role: "Специалист", password: "1234" },
      { name: "Карасев Роман", role: "Младший специалист", password: "1234" },
      { name: "Ахметшина Вероника", role: "Младший специалист", password: "1234" },
      { name: "Бурдина Динара", role: "Младший специалист", password: "1234" },
      { name: "Матвеев Шамиль", role: "Младший специалист", password: "1234" },
      { name: "Черных Даниил", role: "Старший специалист", password: "1234" }
    ];

    const statusMap = {
      todo: { text: "К выполнению", color: "bg-zinc-600" },
      progress: { text: "В работе", color: "bg-amber-500" },
      review: { text: "На проверке", color: "bg-blue-500" },
      verified: { text: "Выполнено", color: "bg-emerald-500" },
      revision: { text: "На доработку", color: "bg-orange-500" }
    };

    db.ref('tasks').on('value', (snap) => {
      tasks = snap.val() ? Object.values(snap.val()) : [];
      renderTasks();
    });

    db.ref('activities').on('value', (snap) => {
      activities = snap.val() ? Object.values(snap.val()) : [];
      renderWorkload();
    });

    db.ref('archive').on('value', (snap) => {
      archive = snap.val() ? Object.values(snap.val()) : [];
      renderTasks();
    });

    function populateAssigneeFilter() {
      const select = document.getElementById('filter-assignee');
      if (!select || !currentUser) return;
      select.innerHTML = '<option value="">Все исполнители</option>';
      getAllowedEmployees().forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.name;
        opt.textContent = emp.name;
        select.appendChild(opt);
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.textContent = message;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      setTimeout(() => {
        toast.classList.remove('flex');
        toast.classList.add('hidden');
      }, 4500);
    }

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const user = users.find(u => u.name === username && u.password === password);
      if (user) {
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(user));
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('current-user').textContent = user.name;
        document.getElementById('current-role').textContent = user.role;
        document.getElementById('add-task-btn').classList.toggle('hidden', user.role === "Младший специалист");
        const canSeeSub = ["Главный специалист","Ведущий специалист","Старший специалист","Специалист"].includes(user.role);
        document.getElementById('btn-sub').classList.toggle('hidden', !canSeeSub);
        populateAssigneeFilter();
        renderAll();
      } else {
        alert("Неверные данные");
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      location.reload();
    }

    function setView(view) {
      currentView = view;
      document.getElementById('btn-mine').classList.toggle('active', view === 'mine');
      document.getElementById('btn-sub').classList.toggle('active', view === 'subordinates');
      document.getElementById('btn-archive').classList.toggle('active', view === 'archive');
      renderTasks();
    }

    function getAllowedEmployees() {
      if (!currentUser) return [];
      if (currentUser.role === "Главный специалист") return users;
      if (["Ведущий специалист", "Старший специалист"].includes(currentUser.role)) {
        return users.filter(u => ["Специалист", "Младший специалист"].includes(u.role));
      }
      if (currentUser.role === "Специалист") return users.filter(u => u.role === "Младший специалист");
      return [];
    }

    function showAddTaskModal() {
      const select = document.getElementById('task-employees');
      select.innerHTML = '';
      getAllowedEmployees().forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.name;
        opt.textContent = `${emp.name} (${emp.role})`;
        select.appendChild(opt);
      });
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const selected = Array.from(document.getElementById('task-employees').selectedOptions).map(opt => opt.value);
      const due = document.getElementById('task-datetime').value;

      if (!title || selected.length === 0) return alert("Введите название и выберите исполнителя");

      selected.forEach(name => {
        tasks.push({
          id: 'task_' + Date.now(),
          title: title,
          assignees: [name],
          dueDate: due,
          status: 'todo',
          createdBy: currentUser.name,
          comments: []
        });
      });

      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);

      hideModal();
      document.getElementById('task-title').value = '';
    }

    function showDelegateModal(taskId) {
      currentDelegatingTaskId = taskId;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const select = document.getElementById('delegate-to');
      select.innerHTML = '';

      const possible = getAllowedEmployees().filter(u => u.name !== currentUser.name);
      
      possible.forEach(person => {
        const opt = document.createElement('option');
        opt.value = person.name;
        opt.textContent = `${person.name} (${person.role})`;
        select.appendChild(opt);
      });

      document.getElementById('delegate-comment').value = '';
      document.getElementById('delegate-modal').classList.remove('hidden');
    }

    function hideDelegateModal() {
      document.getElementById('delegate-modal').classList.add('hidden');
      currentDelegatingTaskId = null;
    }

    let currentDelegatingTaskId = null;

    function confirmDelegate() {
      const task = tasks.find(t => t.id === currentDelegatingTaskId);
      if (!task) return;

      const newAssignee = document.getElementById('delegate-to').value;
      const commentText = document.getElementById('delegate-comment').value.trim();

      if (!newAssignee) return alert("Выберите сотрудника");

      if (!task.assignees.includes(newAssignee)) {
        task.assignees.push(newAssignee);
      }

      if (!task.comments) task.comments = [];
      task.comments.push({
        text: commentText || "Без комментария",
        by: currentUser.name,
        type: "delegation",
        to: newAssignee,
        timestamp: Date.now()
      });

      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);

      hideDelegateModal();
      showToast(`Задача делегирована ${newAssignee}`);
      renderTasks();
    }

    function showActivityModal() {
      const myTasks = tasks.filter(t => t.assignees.includes(currentUser.name) && t.status !== 'done');
      const select = document.getElementById('activity-task');
      select.innerHTML = '<option value="">— Без задачи —</option>';
      myTasks.forEach(task => {
        const opt = document.createElement('option');
        opt.value = task.id;
        opt.textContent = task.title;
        select.appendChild(opt);
      });
      document.getElementById('activity-modal').classList.remove('hidden');
    }

    function hideActivityModal() {
      document.getElementById('activity-modal').classList.add('hidden');
    }

    function saveActivity() {
      const desc = document.getElementById('activity-desc').value.trim();
      const taskId = document.getElementById('activity-task').value;
      const from = document.getElementById('activity-from').value;
      const to = document.getElementById('activity-to').value;

      if (!desc || !from || !to) return alert("Заполните все поля");

      const newAct = {
        id: 'act_' + Date.now(),
        user: currentUser.name,
        description: desc,
        taskId: taskId || null,
        from: from,
        to: to,
        timestamp: Date.now()
      };

      activities.push(newAct);
      const actsObj = {};
      activities.forEach(a => actsObj[a.id] = a);
      db.ref('activities').set(actsObj);
      hideActivityModal();
    }

    function renderWorkload() {
      const container = document.getElementById('workload-list');
      container.innerHTML = '';
      users.forEach(user => {
        const userActs = activities.filter(a => a.user === user.name);
        if (userActs.length > 0) {
          let html = `<div class="mb-4"><div class="font-medium mb-2">${user.name.split(' ')[0]}</div>`;
          userActs.forEach(act => {
            html += `
              <div class="bg-zinc-800 rounded-2xl p-3 mb-2 flex justify-between items-center">
                <div>
                  <div class="text-xs text-zinc-400">${act.from} — ${act.to}</div>
                  <div class="text-sm">${act.description}</div>
                </div>
                <button onclick="deleteActivity('${act.id}')" class="text-red-400 text-xl leading-none">×</button>
              </div>`;
          });
          html += `</div>`;
          container.innerHTML += html;
        } else {
          container.innerHTML += `<div class="bg-zinc-900 rounded-2xl p-3 text-sm text-zinc-500 mb-3">${user.name.split(' ')[0]} — свободен</div>`;
        }
      });
    }

    function deleteActivity(id) {
      if (!confirm("Удалить запись о занятости?")) return;
      activities = activities.filter(a => a.id !== id);
      const actsObj = {};
      activities.forEach(a => actsObj[a.id] = a);
      db.ref('activities').set(actsObj);
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      if (!currentUser) {
        container.innerHTML = `<p class="text-center text-zinc-500 py-20">Пожалуйста, войдите в систему</p>`;
        return;
      }

      const search = document.getElementById('search-input').value.toLowerCase();
      const assigneeFilter = document.getElementById('filter-assignee').value;

      let filtered = [];
      if (currentView === 'mine') {
        filtered = tasks.filter(t => 
          t.assignees.includes(currentUser.name) || 
          (t.createdBy === currentUser.name && t.status === 'review')
        );
      } else if (currentView === 'subordinates') {
        filtered = tasks.filter(t => getAllowedEmployees().some(u => t.assignees.includes(u.name)));
      } else if (currentView === 'archive') {
        filtered = archive;
      }

      if (assigneeFilter) {
        filtered = filtered.filter(t => t.assignees.includes(assigneeFilter));
      }

      if (search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search));

      let html = `<div class="space-y-4">`;
      if (filtered.length === 0) {
        html += `<p class="text-center text-zinc-500 py-20">Задач не найдено</p>`;
      } else {
        filtered.forEach(task => {
          const due = task.dueDate ? new Date(task.dueDate) : null;
          const overdue = due && due < new Date() && task.status !== 'done';
          const st = statusMap[task.status] || { text: task.status || "Неизвестно", color: "bg-zinc-600" };
          const isAssignee = task.assignees.includes(currentUser.name);
          const isCreator = task.createdBy === currentUser.name;
          const showReviewButtons = isCreator && task.status === 'review' && currentView !== 'archive';
          const canDelegate = isAssignee && currentView !== 'archive';

          html += `
            <div class="task-card bg-zinc-900 rounded-3xl p-6 border ${overdue ? 'border-red-500' : 'border-zinc-800'}">
              <div class="flex justify-between items-start">
                <h4 class="font-medium">${task.title}</h4>
                <span class="px-4 py-1 text-xs rounded-full ${st.color}">
                  ${st.text}
                </span>
              </div>
              <p class="text-sm text-zinc-400 mt-3">Исполнители: ${task.assignees.join(', ')}</p>
              ${task.dueDate ? `<p class="text-sm mt-2 ${overdue ? 'text-red-400' : 'text-zinc-400'}">${due.toLocaleString('ru-RU')}</p>` : ''}
              <p class="text-xs text-zinc-500 mt-2">Постановщик: ${task.createdBy}</p>

              ${task.verifiedBy ? `
                <p class="text-xs text-emerald-400 mt-2">Проверил: ${task.verifiedBy}</p>
              ` : ''}

              ${task.comments && task.comments.length > 0 ? `
                <div class="mt-3 text-xs text-zinc-400 border-t border-zinc-700 pt-2">
                  ${task.comments.map(c => `
                    <div class="mb-1">• <strong>${c.by}</strong> ${c.to ? '→ ' + c.to : ''}: ${c.text}</div>
                  `).join('')}
                </div>
              ` : ''}

              ${showReviewButtons ? `
                <div class="flex gap-2 mt-4">
                  <button onclick="approveTask('${task.id}')" class="flex-1 text-xs bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl font-medium">
                    ✓ Проверено (в архив)
                  </button>
                  <button onclick="requestRevision('${task.id}')" class="flex-1 text-xs bg-orange-600 hover:bg-orange-500 py-2 rounded-xl font-medium">
                    На доработку
                  </button>
                </div>
              ` : ''}

              ${canDelegate ? `
                <button onclick="showDelegateModal('${task.id}')" 
                        class="mt-3 w-full text-xs bg-zinc-700 hover:bg-zinc-600 py-2 rounded-xl">
                  Делегировать
                </button>
              ` : ''}
            </div>`;
        });
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    function changeStatus(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (!task.assignees.includes(currentUser.name)) {
        alert("Только исполнитель может менять статус этой задачи");
        return;
      }

      const order = ['todo', 'progress', 'review'];
      let currentIndex = order.indexOf(task.status);
      if (currentIndex === -1) currentIndex = 0;

      task.status = order[(currentIndex + 1) % order.length];

      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);
    }

    function approveTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      task.status = 'verified';
      task.verifiedBy = currentUser.name;
      task.verifiedAt = new Date().toISOString();

      archive.push(task);
      tasks = tasks.filter(t => t.id !== id);

      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);

      const archiveObj = {};
      archive.forEach(t => archiveObj[t.id] = t);
      db.ref('archive').set(archiveObj);

      showToast('Задача подтверждена и отправлена в архив');
      renderTasks();
    }

    function requestRevision(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.status = 'revision';
      const tasksObj = {};
      tasks.forEach(t => tasksObj[t.id] = t);
      db.ref('tasks').set(tasksObj);
    }

    function archiveTask(id) {
      if (!confirm("Переместить задачу в архив?")) return;
      const task = tasks.find(t => t.id === id);
      if (task) {
        archive.push(task);
        tasks = tasks.filter(t => t.id !== id);
        const tasksObj = {};
        tasks.forEach(t => tasksObj[t.id] = t);
        db.ref('tasks').set(tasksObj);
        const archiveObj = {};
        archive.forEach(t => archiveObj[t.id] = t);
        db.ref('archive').set(archiveObj);
        renderTasks();
      }
    }

    function renderAll() {
      renderTasks();
      renderWorkload();
    }

    window.onload = () => {
      const saved = localStorage.getItem('currentUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('current-user').textContent = currentUser.name;
        document.getElementById('current-role').textContent = currentUser.role;
        document.getElementById('add-task-btn').classList.toggle('hidden', currentUser.role === "Младший специалист");
        const canSeeSub = ["Главный специалист","Ведущий специалист","Старший специалист","Специалист"].includes(currentUser.role);
        document.getElementById('btn-sub').classList.toggle('hidden', !canSeeSub);
        populateAssigneeFilter();
        renderAll();
      }
    };
  </script>
</body>
</html>
